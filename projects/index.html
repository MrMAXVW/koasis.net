                    scrollPos.current = window.scrollY;

                };

                    updateOrb();
                };

                const updateOrb = () => {
                    const viewWidth = window.innerWidth;
                    const viewHeight = window.innerHeight;
                    const baseY = (viewHeight * 0.3) + (scrollPos.current * 0.15);
                    const baseX = (viewWidth * 0.75);
                    const dx = mousePos.current.x - baseX;
                    const dy = mousePos.current.y - baseY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    let scale = 1;
                    let opacity = 0.4;
                    if (distance < 400) {
                        scale = 1 + (1 - distance / 400) * 0.6;
                        opacity = 0.4 + (1 - distance / 400) * 0.4;
                    }

                    setOrbStyle({
                        transform: `translate(${baseX - 150}px, ${baseY - 150}px) scale(${scale})`,
                        opacity: opacity
                    });
                };

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('mousemove', handleMouseMove);
                updateOrb();

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('mousemove', handleMouseMove);
                };

                                                        <span>{project.year}</span>
                                                    </div>
                                                    <span className={`sm:ml-auto px-4 py-1.5 rounded-full text-xs font-black tracking-wide uppercase ${
                                                        project.status === 'ongoing' 
                                                            ? 'bg-amber-100 text-amber-800 border border-amber-200' 
                                                            : 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                                                    }`}>
                                                        {project.status === 'ongoing' ? t.status.ongoing : t.status.completed}
                                                    </span>
                                                </div>

                                                <h3 className="text-2xl md:text-3xl font-black text-emerald-950 group-hover:text-emerald-600 transition-colors">
                                                    {project.title}
                                                </h3>

                                                <p className="text-slate-600 text-base leading-relaxed">
                                                    {project.description}
                                                </p>
                                            </div>

                                            {/* Reserved Slot for Customer Logo */}
                                            <div className="pt-2">
                                                <div className="logo-placeholder-pattern border-2 border-dashed border-slate-300 rounded-2xl p-4 flex items-center justify-between text-slate-400 bg-white/60 group-hover:border-emerald-300 transition-colors">
                                                    <div className="flex items-center gap-2 text-sm font-bold text-slate-700">
                                                        <Icon name="domain" size="22px" className="text-emerald-600" />
                                                        <span>{project.clientName}</span>
                                                    </div>
                                                    <span className="text-[10px] uppercase font-black tracking-widest bg-slate-200 text-slate-600 px-2.5 py-1 rounded-md">
                                                        Client Logo Slot
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Right Side: Key Highlights Box */}
                                        <div className="w-full md:w-80 lg:w-96 shrink-0 bg-emerald-50/80 p-6 rounded-2xl border border-emerald-100 space-y-4 flex flex-col justify-center">
                                            <div className="text-xs uppercase font-black tracking-wider text-emerald-800 flex items-center gap-1.5">
                                                <Icon name="military_tech" size="20px" className="text-emerald-600" />
                                                <span>Key Highlights</span>
                                            </div>
                                            <div className="space-y-2.5">
                                                {project.metrics.map((m, idx) => (
                                                    <div key={idx} className="flex items-start gap-2.5 text-xs font-bold text-emerald-950">
                                                        <Icon name="check_circle" size="18px" className="text-emerald-600 shrink-0 mt-0.5" />
                                                        <span className="leading-snug">{m}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {}
                    <section id="contact" className="relative py-28 bg-emerald-950 text-white z-10 border-t border-emerald-900">
                        <div className="container mx-auto px-6">
                            <div className="max-w-2xl mx-auto text-center space-y-8 reveal-on-scroll">
                                <h2 className="text-4xl md:text-5xl font-black leading-tight tracking-tighter">{t.contact.title}</h2>
                                <p className="text-emerald-300 text-lg">{t.contact.subtitle}</p>
                                
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-6 p-8 rounded-3xl bg-emerald-900 border border-emerald-800 w-full transition-all duration-300 group text-left">
                                    <a href={`mailto:${t.contact.emailVal}`} className="flex items-center gap-6 grow">
                                        <div className="w-12 h-12 bg-emerald-800 rounded-xl flex items-center justify-center text-lime-400 shrink-0 group-hover:bg-lime-400 group-hover:text-emerald-900 transition-colors">
                                            <Icon name="mail" size="24px" />
                                        </div>
                                        <div className="flex flex-col">
                                            <span className="text-xs uppercase tracking-widest text-emerald-500 font-black mb-1">
                                                {t.contact.clickToEmail}
                                            </span>
                                            <span className="text-xl font-bold truncate text-white">{t.contact.emailVal}</span>
                                        </div>
                                    </a>
                                    
                                    <button
                                        onClick={copyToClipboard}
                                        className={`px-5 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 shrink-0 ${copied ? 'bg-lime-400 text-emerald-950' : 'bg-emerald-800 hover:bg-lime-400 hover:text-emerald-950 text-lime-400'}`}
                                    >
                                        <Icon name={copied ? "check" : "content_copy"} size="18px" />
                                        <span>{copied ? t.contact.copiedText : t.contact.copyText}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {}
                    <footer className="bg-emerald-950 py-12 text-center border-t border-emerald-900/50 z-10 relative">
                        <p className="text-emerald-700 font-black tracking-widest text-xs uppercase opacity-60">© 2026 KOASIS Company Limited. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
