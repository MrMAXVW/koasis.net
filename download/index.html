                }

        const App = () => {
            const [lang, setLang] = useState('en');
            const [scrolled, setScrolled] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [activeCategory, setActiveCategory] = useState('all');
            const [orbStyle, setOrbStyle] = useState({ transform: 'translate(50vw, 50vh) scale(1)', opacity: 0.6 });
            
            const logoUrl = "https://raw.githubusercontent.com/MrMAXVW/koasis/main/logo.svg";
            const mousePos = useRef({ x: 0, y: 0 });
            const scrollPos = useRef(0);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 20);
                    scrollPos.current = window.scrollY;
                    updateOrb();
                };

                const handleMouseMove = (e) => {
                    mousePos.current = { x: e.clientX, y: e.clientY };
                    updateOrb();
                };

                const updateOrb = () => {
                    const viewWidth = window.innerWidth;
                    const viewHeight = window.innerHeight;
                    const baseY = (viewHeight * 0.3) + (scrollPos.current * 0.1);
                    const baseX = (viewWidth * 0.8);
                    const dx = mousePos.current.x - baseX;
                    const dy = mousePos.current.y - baseY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    let scale = 1;
                    let opacity = 0.4;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (distance < 400) {
                        scale = 1 + (1 - distance / 400) * 0.6;
                        opacity = 0.4 + (1 - distance / 400) * 0.3;
                        offsetX = (dx / distance) * -15;
                        offsetY = (dy / distance) * -15;
                    }

                    setOrbStyle({
                        transform: `translate(${baseX + offsetX - 150}px, ${baseY + offsetY - 150}px) scale(${scale})`,
                        opacity: opacity
                    });
                };

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('mousemove', handleMouseMove);
                updateOrb();

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('mousemove', handleMouseMove);
                };
            }, []);

            const content = {
                en: {
                    title: 'Download Center',
                    subtitle: 'Access product brochures, technical specifications, and user manuals.',
                    placeholder: 'Search documents by keywords...',
                    noResults: 'No matching documents found.',
                    sizeLabel: 'Size',
                    formatLabel: 'Format',
                    downloadBtn: 'Download',
                    itemsFound: 'documents found',
                    categories: {
                        all: 'All',
                        xfusion: 'xFusion',
                        huagoscan: 'Huagoscan',
                        lanxum: 'LANXUM'

                    title: '下載中心',
                    subtitle: '獲取最新的產品彩頁、技術規格及用戶使用手冊。',
                    placeholder: '請輸入關鍵字搜尋文檔...',
                    noResults: '找不到符合條件的文檔。',
                    sizeLabel: '檔案大小',
                    formatLabel: '格式',
                    downloadBtn: '下載',
                    itemsFound: '份文檔已尋獲',
                    categories: {
                        all: '全部',
                        xfusion: '超聚變數字',
                        huagoscan: '華高',
                        lanxum: '立思辰'
                    }

                    title: '下载中心',
                    subtitle: '获取最新的产品彩页、技术规格及用户使用手册。',
                    placeholder: '请输入关键字搜索文档...',
                    noResults: '找不到符合条件的文档。',
                    sizeLabel: '文件大小',
                    formatLabel: '格式',
                    downloadBtn: '下载',
                    itemsFound: '份文档已寻获',
                    categories: {
                        all: '全部',
                        xfusion: '超聚变数字',
                        huagoscan: '华高',
                        lanxum: '立思辰'
                    }
                }
            };
            const t = content[lang];

            const handleLangCycle = () => {
                if (lang === 'en') setLang('zh');
                else if (lang === 'zh') setLang('sc');
                else setLang('en');
            };

            const getTooltipText = () => {
                if (lang === 'en') return 'Switch to Traditional Chinese / 切換至繁體中文';
                if (lang === 'zh') return '切换至简体中文 / Switch to Simplified Chinese';
                return 'Switch to English / 切換至英文';
            };

            const filteredDocuments = documents.filter(doc => {
                // First: filter by category
                if (activeCategory !== 'all' && doc.category !== activeCategory) {
                    return false;
                }

                // Second: filter by search keywords
                const query = searchQuery.toLowerCase().trim();
                if (!query) return true;
                
                const enTitle = (doc.title.en || '').toLowerCase();
                const zhTitle = (doc.title.zh || '').toLowerCase();
                const scTitle = (doc.title.sc || '').toLowerCase();
                
                return enTitle.includes(query) || zhTitle.includes(query) || scTitle.includes(query);
            });

            return (
                <div className="relative overflow-x-hidden w-full min-h-screen bg-slate-50 flex flex-col justify-between">

                            </a>
                            <button 
                                onClick={handleLangCycle}

                            </button>
                        </div>
                    </nav>

                    {/* Header Banner */}
                    <header className="relative pt-36 pb-12 hero-gradient z-10 border-b border-slate-100">
                        <div className="container mx-auto px-6 max-w-4xl text-center space-y-6">

                            <p className="text-lg md:text-xl text-slate-500 leading-relaxed max-w-2xl mx-auto">{t.subtitle}</p>
                            
                            {/* Search Input Box */}
                            <div className="relative max-w-xl mx-auto shadow-xl rounded-2xl overflow-hidden bg-white border border-emerald-100 focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-200 transition-all duration-300">

                                </span>
                                <input 
                                    type="text"

                                    >

                                    </button>
                                )}
                            </div>

                            {}
                            <div className="flex flex-wrap justify-center gap-2 pt-4">

                                    const isSelected = activeCategory === catKey;
                                    return (

                                                isSelected

                                            }`}
                                        >
                                            {t.categories[catKey]}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </header>

                    {/* Document List Section */}
                    <main className="container mx-auto px-6 max-w-4xl py-12 grow relative z-10">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-sm font-black tracking-wider uppercase text-emerald-800 bg-emerald-50 px-4 py-2 rounded-full border border-emerald-100">
                                {filteredDocuments.length} {t.itemsFound}
                            </span>
                        </div>

                        {}
                        {filteredDocuments.length > 0 ? (
                            <div className="space-y-4">
                                {filteredDocuments.map((doc) => {
                                    const isPdf = doc.format === 'PDF';
                                    return (
                                        <div 
                                            key={doc.id}
                                            className="list-row-hover bg-white p-5 md:p-6 rounded-2xl border border-slate-100 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 md:gap-8"
                                        >
                                            {/* File Info */}
                                            <div className="flex items-center gap-4 grow min-w-0">
                                                {/* Specialized visual badges for types */}
                                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${isPdf ? 'bg-rose-50 text-rose-600' : 'bg-blue-50 text-blue-600'}`}>
                                                    <Icon name={isPdf ? "picture_as_pdf" : "folder_zip"} size="26px" />
                                                </div>
                                                <div className="min-w-0 grow">
                                                    <h3 className="font-bold text-lg text-emerald-950 break-words leading-tight" title={doc.title[lang] || doc.title.en}>
                                                        {doc.title[lang] || doc.title.en}
                                                    </h3>
                                                    <div className="flex flex-wrap items-center gap-x-3 gap-y-1 mt-2 text-xs text-slate-400 font-bold tracking-wide uppercase">
                                                        <span className="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded text-[10px] tracking-normal font-black">
                                                            {t.categories[doc.category]}
                                                        </span>
                                                        <span className="hidden sm:inline w-1 h-1 rounded-full bg-slate-300"></span>
                                                        <span>{t.formatLabel}: {doc.format}</span>
                                                        <span className="w-1 h-1 rounded-full bg-slate-300"></span>
                                                        <span>{t.sizeLabel}: {doc.size}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Action trigger */}
                                            <a 
                                                href={doc.path}
                                                download
                                                className="w-full md:w-auto px-6 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-sm transition-all flex items-center justify-center gap-2 active:scale-95 shrink-0 shadow-md shadow-emerald-100"
                                            >
                                                <Icon name="download" size="18px" />
                                                <span>{t.downloadBtn}</span>
                                            </a>
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="text-center py-20 bg-white rounded-3xl border border-slate-100 shadow-sm">
                                <div className="w-16 h-16 bg-slate-50 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Icon name="folder_off" size="32px" />
                                </div>
                                <p className="text-lg text-slate-500 font-bold">{t.noResults}</p>
                            </div>
                        )}
                    </main>

                    {/* Simple Branding Footer */}
                    <footer className="bg-emerald-950 py-12 text-center border-t border-emerald-900/50 relative z-10 mt-12">
                        <p className="text-emerald-700 font-black tracking-widest text-xs uppercase opacity-60">
                            © 2026 KOASIS Company Limited. All Rights Reserved.
                        </p>
                    </footer>

            );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
