                };

                const updateOrb = () => {
                    const viewWidth = window.innerWidth;
                    const viewHeight = window.innerHeight;
                    const baseY = (viewHeight * 0.35) + (scrollPos.current * 0.15);
                    const baseX = (viewWidth * 0.75);
                    const dx = mousePos.current.x - baseX;
                    const dy = mousePos.current.y - baseY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    let scale = 1;
                    let opacity = 0.4;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (distance < 400) {
                        scale = 1 + (1 - distance / 400) * 0.7;
                        opacity = 0.4 + (1 - distance / 400) * 0.3;
                        offsetX = (dx / distance) * -18;
                        offsetY = (dy / distance) * -18;
                    }

                    setOrbStyle({
                        transform: `translate(${baseX + offsetX - 150}px, ${baseY + offsetY - 150}px) scale(${scale})`,
                        opacity: opacity
                    });
                };

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('mousemove', handleMouseMove);
                updateOrb();

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('mousemove', handleMouseMove);
                };

                                        {t.bio.company}
                                    </span>
                                    <h2 className="text-3xl md:text-4xl font-black text-emerald-950 mt-1">{t.bio.name}</h2>
                                    <p className="text-lg font-bold text-slate-500 mt-1">{t.bio.title}</p>
                                </div>

                                {/* Founder Quote */}
                                <div className="bg-emerald-50 border-l-4 border-emerald-600 p-6 rounded-r-2xl italic text-emerald-950 text-base md:text-lg font-medium leading-relaxed">
                                    {t.bio.quote}
                                </div>

                                {/* Quick Highlights Badge List */}
                                <div className="flex flex-wrap justify-center md:justify-start gap-3 pt-2">
                                    <span className="bg-slate-100 text-slate-700 px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5">
                                        <Icon name="verified" size="16px" className="text-emerald-600" /> 15+ Yrs Industry Experience
                                    </span>
                                    <span className="bg-slate-100 text-slate-700 px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5">
                                        <Icon name="memory" size="16px" className="text-emerald-600" /> Hardware & AI Vision Expert
                                    </span>
                                    <span className="bg-slate-100 text-slate-700 px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5">
                                        <Icon name="hub" size="16px" className="text-emerald-600" /> KOASIS Leadership
                                    </span>
                                </div>
                            </div>
                        </div>

                        {}
                        <div className="bg-white rounded-3xl p-8 md:p-12 border border-slate-200/80 shadow-sm space-y-6">
                            <h3 className="text-2xl font-black text-emerald-950 uppercase tracking-tight flex items-center gap-3">
                                <Icon name="article" size="28px" className="text-emerald-600" />
                                <span>{t.bio.summaryHeader}</span>
                            </h3>
                            <div className="w-16 h-1.5 bg-lime-400 rounded-full"></div>
                            
                            <div className="space-y-4 text-slate-600 text-base md:text-lg leading-relaxed pt-2">
                                {t.bio.summaryParagraphs.map((para, i) => (
                                    <p key={i}>{para}</p>
                                ))}
                            </div>
                        </div>

                        {}
                        <div className="space-y-8">
                            <div className="text-center md:text-left">
                                <h3 className="text-2xl md:text-3xl font-black text-emerald-950 uppercase tracking-tight">{t.bio.expertiseTitle}</h3>
                                <div className="w-16 h-1.5 bg-lime-400 mt-2 rounded-full mx-auto md:mx-0"></div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-6">
                                {t.bio.expertise.map((item, idx) => (
                                    <div key={idx} className="bio-card-hover bg-white p-8 rounded-2xl border border-slate-200/80 flex items-start gap-5">
                                        <div className="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center shrink-0">
                                            <Icon name={item.icon} size="28px" />
                                        </div>
                                        <div className="space-y-2">
                                            <h4 className="font-bold text-xl text-emerald-950">{item.title}</h4>
                                            <p className="text-slate-500 text-sm leading-relaxed">{item.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {}
                        <div className="bg-white rounded-3xl p-8 md:p-12 border border-slate-200/80 shadow-sm space-y-8">
                            <h3 className="text-2xl font-black text-emerald-950 uppercase tracking-tight flex items-center gap-3">
                                <Icon name="timeline" size="28px" className="text-emerald-600" />
                                <span>{t.bio.milestonesTitle}</span>
                            </h3>

                            <div className="relative border-l-2 border-emerald-100 pl-6 md:pl-8 space-y-8 ml-2 md:ml-4">
                                {t.bio.milestones.map((ms, idx) => (
                                    <div key={idx} className="relative group">
                                        <div className="absolute -left-[31px] md:-left-[39px] top-1.5 w-4 h-4 bg-emerald-600 border-4 border-white rounded-full group-hover:scale-125 transition-transform"></div>
                                        <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                            <span className="text-xs font-black text-emerald-700 uppercase bg-emerald-100/80 px-3 py-1 rounded-md inline-block mb-2">
                                                {ms.year}
                                            </span>
                                            <h4 className="text-lg font-extrabold text-emerald-950">{ms.title}</h4>
                                            <p className="text-slate-500 text-sm mt-1">{ms.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {}
                        <div className="bg-emerald-950 text-white rounded-3xl p-8 md:p-12 text-center space-y-6 shadow-xl relative overflow-hidden">
                            <div className="absolute -right-12 -bottom-12 w-64 h-64 bg-emerald-800/30 rounded-full blur-2xl pointer-events-none"></div>
                            <h3 className="text-3xl font-black tracking-tight relative z-10">{t.contact.title}</h3>
                            <p className="text-emerald-200/80 text-base md:text-lg max-w-xl mx-auto relative z-10">{t.contact.subtitle}</p>
                            
                            <div className="pt-2 flex flex-col sm:flex-row items-center justify-center gap-4 max-w-md mx-auto relative z-10">
                                <a 
                                    href={`mailto:${t.contact.emailVal}`}
                                    className="w-full sm:w-auto px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg"
                                >
                                    <Icon name="mail" size="20px" />
                                    <span>{t.contact.clickToEmail}</span>
                                </a>

                                <button
                                    onClick={copyToClipboard}
                                    className={`w-full sm:w-auto px-6 py-4 rounded-2xl font-extrabold transition-all flex items-center justify-center gap-2 border ${copied ? 'bg-lime-400 border-lime-400 text-emerald-950' : 'bg-emerald-900/80 border-emerald-700 text-lime-300 hover:bg-emerald-800'}`}
                                >
                                    <Icon name={copied ? "check" : "content_copy"} size="20px" />
                                    <span>{copied ? t.contact.copiedText : t.contact.copyText}</span>
                                </button>
                            </div>
                        </div>

                    </main>

                    {}
                    <footer className="bg-emerald-950 py-12 text-center border-t border-emerald-900/50 relative z-10 mt-12">
                        <p className="text-emerald-700 font-black tracking-widest text-xs uppercase opacity-60">
                            © 2026 KOASIS Company Limited. All Rights Reserved.
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
