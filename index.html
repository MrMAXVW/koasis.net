    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-on-scroll.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .hero-gradient {
            background: radial-gradient(circle at 50% 50%, #f0fdf4 0%, #ffffff 100%);
        }

        .interactive-orb {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.35) 0%, rgba(16, 185, 129, 0) 70%);
            filter: blur(40px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.2, 1), opacity 0.6s ease;
            will-change: transform;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .email-hover-effect:hover {

            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);

            const mousePos = useRef({ x: 0, y: 0 });

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
                }, { threshold: 0.1 });
                
                document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
                
                const handleScroll = () => {
                    setScrolled(window.scrollY > 20);
                    scrollPos.current = window.scrollY;
                    updateOrb();
                };

                const handleMouseMove = (e) => {
                    mousePos.current = { x: e.clientX, y: e.clientY };
                    updateOrb();
                };

                const updateOrb = () => {
                    const viewWidth = window.innerWidth;
                    const viewHeight = window.innerHeight;
                    const baseY = (viewHeight * 0.4) + (scrollPos.current * 0.2);
                    const baseX = (viewWidth * 0.7);
                    const dx = mousePos.current.x - baseX;
                    const dy = mousePos.current.y - baseY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    let scale = 1;
                    let opacity = 0.5;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (distance < 400) {
                        scale = 1 + (1 - distance / 400) * 0.8;
                        opacity = 0.5 + (1 - distance / 400) * 0.4;
                        offsetX = (dx / distance) * -20;
                        offsetY = (dy / distance) * -20;
                    }

                    setOrbStyle({
                        transform: `translate(${baseX + offsetX - 150}px, ${baseY + offsetY - 150}px) scale(${scale})`,
                        opacity: opacity
                    });
                };

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('mousemove', handleMouseMove);
                updateOrb();

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('mousemove', handleMouseMove);
                };

                e.preventDefault();
                const element = document.getElementById(id);
                if (!element) return;

                const el = document.createElement('textarea');
                el.value = t.contact.emailVal;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);

                                                {t.contact.clickToEmail}
                                            </span>
                                            <span className="text-xl md:text-2xl font-bold truncate text-white">{t.contact.emailVal}</span>
                                        </div>
                                    </a>
                                    
                                    <button
                                        onClick={copyToClipboard}
                                        className={`px-5 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 shrink-0 ${copied ? 'bg-lime-400 text-emerald-950' : 'bg-emerald-800 hover:bg-lime-400 hover:text-emerald-950 text-lime-400'}`}
                                    >
                                        <Icon name={copied ? "check" : "content_copy"} size="18px" />
                                        <span>{copied ? t.contact.copiedText : t.contact.copyText}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {}
                    <footer className="bg-emerald-950 py-12 text-center border-t border-emerald-900/50 z-10 relative">
                        <p className="text-emerald-700 font-black tracking-widest text-xs uppercase opacity-60">© 2026 KOASIS Company Limited. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
