                    updateOrb();
                };

                const handleMouseMove = (e) => {
                    mousePos.current = { x: e.clientX, y: e.clientY };
                    updateOrb();
                };

                const updateOrb = () => {
                    const viewWidth = window.innerWidth;
                    const viewHeight = window.innerHeight;
                    const baseY = (viewHeight * 0.35) + (scrollPos.current * 0.15);
                    const baseX = (viewWidth * 0.75);
                    const dx = mousePos.current.x - baseX;
                    const dy = mousePos.current.y - baseY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    let scale = 1;
                    let opacity = 0.4;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (distance < 400) {
                        scale = 1 + (1 - distance / 400) * 0.7;
                        opacity = 0.4 + (1 - distance / 400) * 0.3;
                        offsetX = (dx / distance) * -18;
                        offsetY = (dy / distance) * -18;
                    }

                    setOrbStyle({
                        transform: `translate(${baseX + offsetX - 150}px, ${baseY + offsetY - 150}px) scale(${scale})`,
                        opacity: opacity
                    });
                };

                window.addEventListener('scroll', handleScroll);
                window.addEventListener('mousemove', handleMouseMove);
                updateOrb();

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('mousemove', handleMouseMove);
                };

                                        <Icon name="folder_open" size="24px" className="text-emerald-600" />
                                        <span>{t.nav.projects}</span>
                                    </a>
                                </div>

                                <div className="pt-6 border-t border-slate-100 text-xs font-bold text-slate-400">
                                    KOASIS Company Limited
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Header Section */}
                    <header className="relative pt-36 pb-16 hero-gradient z-10 border-b border-slate-100">
                        <div className="container mx-auto px-6 max-w-5xl text-center space-y-4">
                            <span className="text-xs font-black tracking-widest uppercase text-emerald-800 bg-emerald-100/80 px-4 py-2 rounded-full border border-emerald-200 inline-block">
                                {t.hero.badge}
                            </span>
                            <h1 className="text-4xl md:text-6xl font-black text-emerald-950 tracking-tighter">{t.hero.title}</h1>
                            <p className="text-lg md:text-xl text-slate-500 max-w-2xl mx-auto leading-relaxed">{t.hero.subtitle}</p>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="container mx-auto px-6 max-w-5xl py-16 relative z-10 space-y-20 grow">
                        
                        {/* Company Bio & Story Split Section */}
                        <div className="grid md:grid-cols-2 gap-8">
                            {/* Who We Are */}
                            <div className="bg-white p-8 md:p-10 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 card-hover">
                                <span className="text-xs font-black tracking-wider uppercase text-emerald-600 bg-emerald-50 px-3 py-1 rounded-md inline-block">
                                    {t.bioSection.tag}
                                </span>
                                <h2 className="text-2xl md:text-3xl font-black text-emerald-950">{t.bioSection.title}</h2>
                                <p className="text-slate-600 leading-relaxed text-sm md:text-base">{t.bioSection.p1}</p>
                                <p className="text-slate-600 leading-relaxed text-sm md:text-base">{t.bioSection.p2}</p>
                            </div>

                            {/* Our Story */}
                            <div className="bg-white p-8 md:p-10 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 card-hover">
                                <span className="text-xs font-black tracking-wider uppercase text-emerald-600 bg-emerald-50 px-3 py-1 rounded-md inline-block">
                                    {t.storySection.tag}
                                </span>
                                <h2 className="text-2xl md:text-3xl font-black text-emerald-950">{t.storySection.title}</h2>
                                <p className="text-slate-600 leading-relaxed text-sm md:text-base">{t.storySection.p1}</p>
                                <p className="text-slate-600 leading-relaxed text-sm md:text-base">{t.storySection.p2}</p>
                            </div>
                        </div>

                        {/* Impact Stats Counter Section */}
                        <div className="bg-emerald-950 rounded-3xl p-8 md:p-12 text-white shadow-xl relative overflow-hidden">
                            <div className="absolute -right-16 -top-16 w-64 h-64 bg-emerald-800/20 rounded-full blur-3xl pointer-events-none"></div>
                            <h3 className="text-center text-xs font-black uppercase tracking-widest text-lime-400 mb-10">{t.statsSection.title}</h3>
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-8 text-center relative z-10">
                                {t.statsSection.items.map((stat, i) => (
                                    <div key={i} className="space-y-2">
                                        <div className="text-3xl md:text-5xl font-black text-white tracking-tight">{stat.number}</div>
                                        <div className="text-emerald-300/80 text-xs md:text-sm font-bold uppercase tracking-wider">{stat.label}</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Mission, Vision & Strategic Commitments */}
                        <div className="space-y-12">
                            {/* Mission & Vision Row */}
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="bg-emerald-900 text-white p-8 md:p-10 rounded-3xl space-y-4 relative overflow-hidden">
                                    <div className="w-12 h-12 bg-white/10 text-lime-400 rounded-2xl flex items-center justify-center mb-2">
                                        <Icon name="rocket_launch" size="28px" />
                                    </div>
                                    <span className="text-xs font-black tracking-widest uppercase text-lime-300">
                                        {t.missionVision.missionTag}
                                    </span>
                                    <h3 className="text-2xl font-extrabold">{t.missionVision.missionTitle}</h3>
                                    <p className="text-emerald-100/80 leading-relaxed text-sm md:text-base">{t.missionVision.missionDesc}</p>
                                </div>

                                <div className="bg-emerald-900 text-white p-8 md:p-10 rounded-3xl space-y-4 relative overflow-hidden">
                                    <div className="w-12 h-12 bg-white/10 text-lime-400 rounded-2xl flex items-center justify-center mb-2">
                                        <Icon name="visibility" size="28px" />
                                    </div>
                                    <span className="text-xs font-black tracking-widest uppercase text-lime-300">
                                        {t.missionVision.visionTag}
                                    </span>
                                    <h3 className="text-2xl font-extrabold">{t.missionVision.visionTitle}</h3>
                                    <p className="text-emerald-100/80 leading-relaxed text-sm md:text-base">{t.missionVision.visionDesc}</p>
                                </div>
                            </div>

                            {/* Goals / Commitments Grid */}
                            <div className="bg-white rounded-3xl p-8 md:p-12 border border-slate-200/80 shadow-sm space-y-8">
                                <div>
                                    <span className="text-xs font-black tracking-wider uppercase text-emerald-600 bg-emerald-50 px-3 py-1 rounded-md inline-block mb-2">
                                        {t.missionVision.goalsTag}
                                    </span>
                                    <h3 className="text-2xl md:text-3xl font-black text-emerald-950">{t.missionVision.goalsTitle}</h3>
                                </div>

                                <div className="grid sm:grid-cols-2 gap-6">
                                    {t.missionVision.goalsList.map((goal, idx) => (
                                        <div key={idx} className="p-6 rounded-2xl bg-slate-50 border border-slate-100 space-y-2 card-hover">
                                            <div className="w-10 h-10 bg-emerald-100 text-emerald-700 rounded-xl flex items-center justify-center mb-3">
                                                <Icon name={goal.icon} size="22px" />
                                            </div>
                                            <h4 className="font-extrabold text-emerald-950 text-lg">{goal.title}</h4>
                                            <p className="text-slate-500 text-sm leading-relaxed">{goal.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Milestones / Roadmap Section */}
                        <div className="space-y-12">
                            <div className="bg-white rounded-3xl p-8 md:p-12 border border-slate-200/80 shadow-sm space-y-8">
                                <div>
                                    <span className="text-xs font-black tracking-widest uppercase text-emerald-800 bg-emerald-100 px-3 py-1 rounded-md inline-block mb-2">
                                        {t.placeholdersSection.tag}
                                    </span>
                                    <h3 className="text-2xl md:text-3xl font-black text-emerald-950">{t.placeholdersSection.milestoneTitle}</h3>
                                </div>

                                <div className="space-y-4">
                                    {t.placeholdersSection.milestones.map((ms, idx) => (
                                        <div key={idx} className="bg-slate-50 p-6 rounded-2xl border border-slate-100 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 card-hover">
                                            <div className="flex items-center gap-4">
                                                <span className="text-xs font-black text-white bg-emerald-600 px-3 py-1.5 rounded-lg shrink-0">
                                                    {ms.year}
                                                </span>
                                                <div>
                                                    <h4 className="font-bold text-emerald-950 text-base">{ms.title}</h4>
                                                    <p className="text-xs text-slate-500 mt-0.5">{ms.desc}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Contact CTA Section */}
                        <div className="bg-emerald-950 text-white rounded-3xl p-8 md:p-12 text-center space-y-6 shadow-xl relative overflow-hidden">
                            <div className="absolute -right-12 -bottom-12 w-64 h-64 bg-emerald-800/30 rounded-full blur-2xl pointer-events-none"></div>
                            <h3 className="text-3xl font-black tracking-tight relative z-10">{t.contact.title}</h3>
                            <p className="text-emerald-200/80 text-base md:text-lg max-w-xl mx-auto relative z-10">{t.contact.subtitle}</p>
                            
                            <div className="pt-2 flex flex-col sm:flex-row items-center justify-center gap-4 max-w-md mx-auto relative z-10">
                                <a 
                                    href={`mailto:${t.contact.emailVal}`}
                                    className="w-full sm:w-auto px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg"
                                >
                                    <Icon name="mail" size="20px" />
                                    <span>{t.contact.clickToEmail}</span>
                                </a>

                                <button
                                    onClick={copyToClipboard}
                                    className={`w-full sm:w-auto px-6 py-4 rounded-2xl font-extrabold transition-all flex items-center justify-center gap-2 border ${copied ? 'bg-lime-400 border-lime-400 text-emerald-950' : 'bg-emerald-900/80 border-emerald-700 text-lime-300 hover:bg-emerald-800'}`}
                                >
                                    <Icon name={copied ? "check" : "content_copy"} size="20px" />
                                    <span>{copied ? t.contact.copiedText : t.contact.copyText}</span>
                                </button>
                            </div>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="bg-emerald-950 py-12 text-center border-t border-emerald-900/50 relative z-10 mt-12">
                        <p className="text-emerald-700 font-black tracking-widest text-xs uppercase opacity-60">
                            © 2026 KOASIS Company Limited. All Rights Reserved.
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
